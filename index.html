<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koordineringsplan – delt visning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>:root{
  --paper:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F6; --ink:#1B2430; --muted:#5B6B7C;
  --line:#D8DEE6; --line-strong:#B9C3CE; --accent:#2B6CB0; --accent-soft:#E7F0FA;
  --danger:#C4432B; --ok:#2F7A52; --focus:#2B6CB0;
  --font-display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --label-w:168px; --header-h:60px; --title-h:46px; --row-h:34px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A21; --surface:#1B222B; --surface-2:#212A34; --ink:#E9EDF2; --muted:#95A3B3;
    --line:#2E3944; --line-strong:#3D4B58; --accent:#6CA9E0; --accent-soft:#22384C;
    --danger:#E28066; --ok:#6FBE93; --focus:#6CA9E0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A21; --surface:#1B222B; --surface-2:#212A34; --ink:#E9EDF2; --muted:#95A3B3;
  --line:#2E3944; --line-strong:#3D4B58; --accent:#6CA9E0; --accent-soft:#22384C;
  --danger:#E28066; --ok:#6FBE93; --focus:#6CA9E0; color-scheme:dark;
}
*{box-sizing:border-box;}
body{background:var(--paper); color:var(--ink); font-family:var(--font-display); -webkit-font-smoothing:antialiased; margin:0;}
.app{max-width:1360px; margin:0 auto; padding:30px 26px 70px;}
h1,h2{margin:0;}
.titlebar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
.titlebar h1{font-size:1.5rem; font-weight:600;}
.badge{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; background:var(--accent-soft); color:var(--accent); padding:3px 9px; border-radius:20px; font-weight:700;}
.lede{color:var(--muted); font-size:.9rem; max-width:70ch; margin:8px 0 18px;}
.legend{display:flex; flex-wrap:wrap; gap:16px 26px; margin-bottom:14px;}
.legend .group{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
.legend .glabel{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; padding:3px 9px 3px 7px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink);}
.chip em{font-style:normal; color:var(--muted); font-size:.72rem;}
.legend .group.activity-list{flex-direction:column; align-items:flex-start; gap:6px; width:100%;}
.activity-items{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; width:100%;}
.activity-item{display:flex; flex-direction:column; gap:2px;}
.activity-row{display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--ink); font-weight:500;}
.activity-desc{font-size:.72rem; color:var(--muted); padding-left:20px; line-height:1.35;}
.swatch{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
.fagchip{font-family:var(--font-mono); font-size:.76rem; font-weight:600; padding:5px 12px; border-radius:20px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); cursor:pointer;}
.fagchip[aria-pressed="true"]{color:#fff; border-color:transparent;}
.hint-text{font-size:.78rem; color:var(--muted); margin:0;}
.mydeadlines{border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:12px 16px; margin-bottom:16px;}
.mydeadlines h2{font-size:.92rem; font-weight:600; margin-bottom:8px;}
.mydeadlines table{width:100%; border-collapse:collapse; font-size:.84rem;}
.mydeadlines td{padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
.mydeadlines tr:last-child td{border-bottom:none;}
.mydeadlines .tag{font-family:var(--font-mono); font-size:.62rem; text-transform:uppercase; background:var(--accent-soft); color:var(--accent); border-radius:4px; padding:1px 5px; margin-left:6px;}
.timeline-card{border:1px solid var(--line); border-radius:16px; background:var(--surface); overflow:hidden; box-shadow:0 1px 2px rgba(20,26,33,.04);}
.timeline-scroll{overflow-x:auto; overflow-y:hidden;}
.timeline-inner{position:relative;}
.ruler-row{display:flex; border-bottom:1px solid var(--line); background:var(--surface);}
.corner-cell{flex:0 0 var(--label-w); width:var(--label-w); position:sticky; left:0; z-index:4; background:var(--surface); border-right:1px solid var(--line); display:flex; align-items:center; padding:0 14px; font-family:var(--font-mono); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
.ruler-track{position:relative; flex:1; height:var(--header-h);}
.ruler-track::before{content:""; position:absolute; left:0; right:0; top:21px; height:1px; background:var(--line); opacity:0.6; pointer-events:none;}
.month-tick{position:absolute; top:0; bottom:0; z-index:1;}
.month-tick .tline{width:1px; height:100%; background:var(--line-strong); opacity:0.55;}
.month-tick .mlabel{position:absolute; top:4px; left:5px; font-family:var(--font-display); font-weight:700; font-size:.72rem; color:var(--ink); white-space:nowrap; text-transform:capitalize;}
.week-tick{position:absolute; top:0; bottom:0;}
.week-tick .tline{width:1px; height:100%; background:var(--line); opacity:0.4;}
.week-tick .wlabel{position:absolute; top:25px; left:4px; font-family:var(--font-mono); font-size:.62rem; color:var(--muted); opacity:0.85; white-space:nowrap;}
.today-flag{position:absolute; top:4px; transform:translateX(-50%); font-family:var(--font-mono); font-size:.64rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; background:var(--accent); color:#fff; padding:2px 6px; border-radius:5px; white-space:nowrap; z-index:2;}
.cross-flag{position:absolute; top:44px; transform:translateX(-50%); font-family:var(--font-mono); font-size:.64rem; font-weight:600; background:var(--ink); color:var(--surface); padding:2px 7px; border-radius:5px; white-space:nowrap; max-width:160px; overflow:hidden; text-overflow:ellipsis; z-index:1; cursor:pointer;}
.cross-flag-info{background:var(--surface-2); color:var(--muted); border:1px solid var(--line); font-style:italic;}
.cross-flag-span{transform:none; text-align:center; max-width:none; overflow:visible; text-overflow:clip; border-radius:9px; box-sizing:border-box;}
.grid-overlay{position:absolute; left:var(--label-w); top:var(--header-h); z-index:0; pointer-events:none;}
.cross-overlay{position:absolute; left:var(--label-w); top:var(--header-h); z-index:1; pointer-events:none;}
.area-row{display:flex; border-top:1px solid var(--line);}
.area-label{flex:0 0 var(--label-w); width:var(--label-w); position:sticky; left:0; z-index:2; background:var(--surface); border-right:1px solid var(--line);}
.area-title{height:var(--title-h); display:flex; align-items:center; gap:9px; padding:0 14px; font-weight:600; font-size:.86rem; border-bottom:1px solid var(--line);}
.area-title .idx{font-family:var(--font-mono); font-size:.68rem; color:var(--accent); background:var(--accent-soft); border-radius:5px; padding:1px 6px; font-weight:700;}
.fag-row-label{height:var(--row-h); display:flex; align-items:center; gap:8px; padding:0 14px 0 18px; font-family:var(--font-mono); font-size:.74rem; color:var(--muted); border-bottom:1px dashed var(--line); transition:background .15s,color .15s;}
.fag-row-label:last-child{border-bottom:none;}
.fag-row-label.fag-highlight{background:var(--accent-soft); color:var(--ink); font-weight:600;}
.fag-dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
.area-canvas{flex:1; position:relative;}
.area-canvas svg{display:block;}
.hit{cursor:pointer;}
.dimmed{opacity:.15;}
.fag-focus{filter:drop-shadow(0 0 3px var(--accent));}
.snapshot-note{font-size:.78rem; color:var(--muted); margin-top:18px;}
.popover{position:fixed; z-index:20; max-width:260px; background:var(--surface); border:1px solid var(--line-strong); border-radius:10px; box-shadow:0 8px 24px rgba(20,26,33,.18); padding:10px 26px 10px 12px; font-size:.82rem; color:var(--ink);}
.popover-close{position:absolute; top:2px; right:4px; border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:1.05rem; line-height:1; padding:4px 7px;}
.popover-close:hover{color:var(--danger);}
.popover-body b{display:block; margin-bottom:3px;}
.popover-body .pv-line{display:block; color:var(--muted); font-size:.78rem;}
.popover-body .pv-desc{display:block; color:var(--ink); font-size:.8rem; margin-top:6px; font-style:italic;}
@media (max-width:640px){ .app{padding:20px 14px 50px;} }
@media print{
  @page{ size: landscape; margin: 10mm; }
  body{ background:#fff; }
  .app{ max-width:none; padding:0; }
  .badge, .popover, .mydeadlines{ display:none !important; }
  .timeline-scroll{ overflow:visible !important; }
  .area-row{ break-inside:avoid; }
}</style>
</head>

</div>
<div class="popover" id="popoverEl" hidden>
  <button type="button" class="popover-close" id="popoverClose">&times;</button>
  <div class="popover-body" id="popoverBody"></div>
</div>

  function fagIdx(id){ for(var i=0;i<state.fags.length;i++){ if(state.fags[i].id===id) return i; } return -1; }
  function colorForFag(id){ var f=fagById(id); if(f&&f.color) return f.color; var i=fagIdx(id); return i===-1?"var(--muted)":FAG_COLOR_POOL[i%FAG_COLOR_POOL.length]; }
  function phaseById(id){ return state.phases.find(function(p){ return p.id===id; }); }
  function areaRelevantFags(area){
    var ids={};
    state.milestones.forEach(function(m){
      if(m.area!==area.id) return;
      var ph=phaseById(m.phase);
      if(ph && ph.kind!=="shared"){ (m.fags||[]).forEach(function(fid){ ids[fid]=true; }); }
    });

  }
  function isDeadlinePhase(ph){ return !ph || ph.deadline !== false; }
  function isDeadlineCross(c){ return !c || c.deadline !== false; }
  function crossHasSpan(c){ var d1=parseDate(c.date), d2=parseDate(c&&c.dateEnd); return !!(d1&&d2&&d2>d1); }
  function fmtCrossRange(c){ var d1=parseDate(c.date); if(!d1) return ""; if(crossHasSpan(c)) return fmtDanish(d1)+"–"+fmtDanish(parseDate(c.dateEnd)); return fmtDanish(d1); }
  function shapeForPhase(id){
    var i=0;
    for(var k=0;k<state.phases.length;k++){
      var p=state.phases[k];
      if(p.id===id) return p.kind==="shared" ? "bar" : SHAPE_POOL[i%SHAPE_POOL.length];

  }
  function regularPolygonPoints(cx,cy,r,sides,rotationDeg){
    var pts=[]; var rot=(rotationDeg||0)*Math.PI/180;
    for(var i=0;i<sides;i++){ var theta=rot+i*2*Math.PI/sides; pts.push((cx+r*Math.cos(theta)).toFixed(2)+","+(cy+r*Math.sin(theta)).toFixed(2)); }
    return pts.join(" ");
  }
  function shapeMarkup(shape,cx,cy,fillCss){
    var style="style=\"fill:"+fillCss+"; stroke:var(--surface)\" stroke-width=\"1.6\"";
    switch(shape){
      case "square": return "<polygon points=\""+regularPolygonPoints(cx,cy,7.6,4,45)+"\" "+style+" stroke-linejoin=\"round\"/>";
      case "diamond": return "<polygon points=\""+regularPolygonPoints(cx,cy,8,4,0)+"\" "+style+" stroke-linejoin=\"round\"/>";
      case "triangle": return "<polygon points=\""+regularPolygonPoints(cx,cy,8,3,-90)+"\" "+style+" stroke-linejoin=\"round\"/>";
      case "pentagon": return "<polygon points=\""+regularPolygonPoints(cx,cy,7.6,5,-90)+"\" "+style+" stroke-linejoin=\"round\"/>";

    }
  }
  function doneBadgeSvg(cx,cy){
    return "<circle cx=\""+cx+"\" cy=\""+cy+"\" r=\"5\" style=\"fill:#2f9e44; stroke:var(--surface)\" stroke-width=\"1.2\"/>"
      + "<path d=\"M"+(cx-2.4)+" "+cy+" l1.6 1.8 l3-3.6\" style=\"fill:none; stroke:#fff\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>";
  }
  function parseDate(s){ if(!s) return null; var d=new Date(s+"T00:00:00"); return isNaN(d.getTime())?null:d; }
  function fmtDanish(d){ return d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
  function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }
  function startOfDay(d){ var r=new Date(d); r.setHours(0,0,0,0); return r; }
  function isWeekend(d){ var dow=d.getDay(); return dow===0||dow===6; }
  function workdaysBetween(a,b){
    var sign=1, from=a, to=b;
    if(b<a){ sign=-1; from=b; to=a; }
    var count=0; var d=new Date(from);
    while(d<to){ if(!isWeekend(d)) count++; d=addDays(d,1); }
    return sign*count;
  }

  function computeRange(){
    var dates=[];
    state.milestones.forEach(function(m){
      var d=parseDate(m.date); if(d) dates.push(d);
      if(m.fagDates){ Object.keys(m.fagDates).forEach(function(f){ var dd=parseDate(m.fagDates[f]); if(dd) dates.push(dd); }); }
    });
    (state.crossMilestones||[]).forEach(function(m){ var d=parseDate(m.date); if(d) dates.push(d); var d2=parseDate(m.dateEnd); if(d2) dates.push(d2); });
    var today=startOfDay(new Date());
    var start,end;
    if(dates.length===0){ start=today; end=addDays(today,120); }
    else{
      var min=new Date(Math.min.apply(null,dates)), max=new Date(Math.max.apply(null,dates));
      start=addDays(min,-7); end=addDays(max,14);
      if(start>today){ start=addDays(today,-7); }
      if(daysBetween(start,end)<42){ end=addDays(start,42); }
    }
    return {start:start,end:end};
  }
  function isoWeekNumber(d){
    var date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    var dayNum=(date.getUTCDay()+6)%7;
    date.setUTCDate(date.getUTCDate()-dayNum+3);
    var firstThursday=new Date(Date.UTC(date.getUTCFullYear(),0,4));
    var diff=date-firstThursday;
    return 1+Math.round(diff/(7*24*3600*1000));
  }
  function genWeekTicks(start,end){
    var ticks=[];
    var d=new Date(start); var dow=d.getDay(); var diffToMonday=(dow===0?-6:1-dow);
    d=addDays(d,diffToMonday);
    while(d<=end){ if(d>=start) ticks.push({date:new Date(d), week:isoWeekNumber(d)}); d=addDays(d,7); }
    return ticks;
  }
  function genMonthTicks(start,end){
    var ticks=[];
    var d2=new Date(start.getFullYear(),start.getMonth(),1);
    if(d2<start) d2=new Date(d2.getFullYear(),d2.getMonth()+1,1);
    while(d2<=end){ ticks.push({date:new Date(d2), label:MONTHS[d2.getMonth()]+" "+d2.getFullYear()}); d2=new Date(d2.getFullYear(),d2.getMonth()+1,1); }
    if(!ticks.length || ticks[0].date>start){ ticks.unshift({date:new Date(start), label:MONTHS[start.getMonth()]+" "+start.getFullYear()}); }
    return ticks;
  }

  function renderTimeline(){
    var range=computeRange();
    var totalWorkdays=Math.max(1,workdaysBetween(range.start,range.end));
    var pxPerDay=Math.min(30,Math.max(7,1150/totalWorkdays));
    var totalWidth=Math.round(totalWorkdays*pxPerDay)+50;
    var totalContentH=AREAS.reduce(function(sum,area){ return sum+TITLE_H+areaRelevantFags(area).length*ROW_H; },0);
    function xOf(date){ return Math.round(workdaysBetween(range.start,date)*pxPerDay); }
    function laneY(idx){ return TITLE_H+idx*ROW_H+ROW_H/2; }
    var weekTicks=genWeekTicks(range.start,range.end);
    var monthTicks=genMonthTicks(range.start,range.end);

    });
    crossPacked.sort(function(a,b){ return a.x-b.x; });
    var crossRowEndX=[];
    crossPacked.forEach(function(it){
      var r=0;
      while(crossRowEndX[r]!==undefined && it.x<crossRowEndX[r]) r++;
      crossRowEndX[r]=it.x+it.width+6;
      it.row=r;
    });
    var maxCrossRow=crossPacked.reduce(function(mx,it){ return Math.max(mx,it.row); },0);
    var rulerH=60+maxCrossRow*CROSS_ROW_STEP;

    var html="";

    html+="<div class=\"grid-overlay\" style=\"width:"+totalWidth+"px; height:"+totalContentH+"px; top:"+rulerH+"px;\">"+gridSvg+"</div>";

    var crossSvg="<svg width=\""+totalWidth+"\" height=\""+totalContentH+"\">";
    crossWithDates.forEach(function(c){
      var x=xOf(parseDate(c.date));

      if(hasSpan){

        crossSvg+="<line x1=\""+x2+"\" y1=\"0\" x2=\""+x2+"\" y2=\""+totalContentH+"\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-dasharray=\""+(isDeadline?"3,2.4":"2,3.5")+"\" stroke-opacity=\""+(isDeadline?"0.55":"0.3")+"\"/>";
      }
      crossSvg+="<line x1=\""+x+"\" y1=\"0\" x2=\""+x+"\" y2=\""+totalContentH+"\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-dasharray=\""+(isDeadline?"3,2.4":"2,3.5")+"\" stroke-opacity=\""+(isDeadline?"0.55":"0.3")+"\"/>";

    html+="<div class=\"cross-overlay\" style=\"width:"+totalWidth+"px; height:"+totalContentH+"px; top:"+rulerH+"px;\">"+crossSvg+"</div>";

    AREAS.forEach(function(area){

      areaFagList.forEach(function(f){

      });

      var areaMilestones=state.milestones.filter(function(m){ return m.area===area.id; });

      var sharedMarkYByMid={};
      function depSourcePoint(ref){

      var maxIShared=areaFagList.length-1;
      var yBotShared=laneY(maxIShared);
      var yBaseShared=TITLE_H-12;
      var sharedList=[];

      sharedList.sort(function(a,b){ return a.x-b.x; });

      sharedList.forEach(function(it){

        g+="<line x1=\""+x+"\" y1=\""+markY+"\" x2=\""+x+"\" y2=\""+yBotShared+"\" style=\"stroke:"+(isDeadline?"var(--line-strong)":"var(--line)")+"\""+(isDeadline?"":" stroke-dasharray=\"5,3\"")+" stroke-width=\"2.6\" stroke-linecap=\"round\"/>";
        if(isDeadline){

        g+="<text x=\""+(x+14)+"\" y=\""+(markY+3)+"\" style=\"fill:"+(isDeadline?"var(--ink)":"var(--muted)")+"; font-family:var(--font-display); font-weight:600"+(isDeadline?"":"; font-style:italic")+"\" font-size=\"10\">"+esc(ph.label)+"</text>";

      var tagCandidates=[];

        entries.forEach(function(e){

          var descAttr3=ph.description?" data-desc=\""+esc(ph.description)+"\"":"";
          svgParts.push("<g class=\"hit\" data-fag=\""+f.id+"\" data-name=\""+esc(ph.label)+"\" data-sub=\""+esc(sub)+"\""+descAttr3+">"+shapeMarkup(shape,x,y,colorForFag(f.id))+(eDone?doneBadgeSvg(x+5,y+5):"")+"</g>");
        });
        var firstIdxs=idxsFor(byDate[dateKeys[0]]);
        if(firstIdxs.length){

          var lx=xOf(parseDate(dateKeys[0])), ly=laneY(anchorI);
          var tagLen=Math.max(24, textWidth(ph.label,9,false)+11);

      });
      var TAG_LIFT=13;
      var tagsByLane={};
      tagCandidates.forEach(function(t){ (tagsByLane[t.y]=tagsByLane[t.y]||[]).push(t); });
      Object.keys(tagsByLane).forEach(function(laneKey){
        var laneTags=tagsByLane[laneKey];
        laneTags.sort(function(a,b){ return a.x-b.x; });
        var prevEnd=-Infinity;
        laneTags.forEach(function(t){
          var desiredLeft=t.x-t.width/2;
          var startLeft=Math.max(desiredLeft, prevEnd);
          t.drawX=startLeft;
          prevEnd=startLeft+t.width+6;
        });
      });
      tagCandidates.forEach(function(t){
        var ty=t.y-TAG_LIFT;
        svgParts.push("<g pointer-events=\"none\"><rect x=\""+t.drawX+"\" y=\""+(ty-7)+"\" width=\""+t.width+"\" height=\"14\" rx=\"4\" style=\"fill:var(--surface); stroke:var(--line)\" stroke-width=\"1\" opacity=\"0.78\"/><text x=\""+(t.drawX+t.width/2)+"\" y=\""+(ty+3)+"\" text-anchor=\"middle\" style=\"fill:var(--muted); font-family:var(--font-display); font-weight:600\" font-size=\"9\">"+esc(t.label)+"</text></g>");
      });

      html+="<div class=\"area-canvas\" style=\"height:"+areaH+"px;\"><svg width=\""+totalWidth+"\" height=\""+areaH+"\">"+svgParts.join("")+"</svg></div>";
      html+="</div>";
    });

    document.getElementById("timelineInner").innerHTML=html;
    document.getElementById("timelineInner").style.width=(LABEL_W+totalWidth)+"px";
  }

  function renderMyDeadlines(){
    var el=document.getElementById("mydeadlinesEl");
    if(!activeFag){ el.innerHTML=""; el.className=""; return; }
    var f=fagById(activeFag);
    if(!f){ el.innerHTML=""; el.className=""; return; }
    var rows=[];
    state.milestones.forEach(function(m){
      var ph=phaseById(m.phase); if(!ph) return;
      var area=AREAS.find(function(a){ return a.id===m.area; });
      if(ph.kind==="shared"){
        if(isDeadlinePhase(ph) && m.date){ rows.push({date:m.date, dateDisplay:fmtDanish(parseDate(m.date)), area:area?area.label:m.area, label:ph.label, tag:"fælles", done:!!m.done}); }
      } else {
        var fd=m.fagDates||{};
        if(fd[activeFag]){ rows.push({date:fd[activeFag], dateDisplay:fmtDanish(parseDate(fd[activeFag])), area:area?area.label:m.area, label:ph.label, tag:null, done:!!(m.doneFags && m.doneFags[activeFag])}); }
      }
    });
    (state.crossMilestones||[]).forEach(function(c){
      if(isDeadlineCross(c) && c.date){ rows.push({date:c.date, dateDisplay:fmtCrossRange(c), area:"Alle områder", label:c.label, tag:"tværgående", done:false}); }
    });
    rows.sort(function(a,b){ return parseDate(a.date)-parseDate(b.date); });
    var html="<h2>"+esc(f.label)+"s deadlines ("+rows.length+")</h2>";
    if(!rows.length){
      html+="<p class=\"hint-text\">Ingen datoer sat endnu for "+esc(f.label)+".</p>";
    } else {
      html+="<table><tbody>";
      rows.forEach(function(r){
        html+="<tr"+(r.done?" style=\"opacity:0.6\"":"")+"><td style=\"white-space:nowrap; font-family:var(--font-mono);\">"+esc(r.dateDisplay)+"</td><td>"+esc(r.area)+"</td><td>"+(r.done?"<span style=\"text-decoration:line-through\">"+esc(r.label)+"</span>":esc(r.label))+(r.tag?"<span class=\"tag\">"+r.tag+"</span>":"")+(r.done?"<span class=\"tag\" style=\"background:#d3f5df; color:#2f9e44;\">udført</span>":"")+"</td></tr>";
      });
      html+="</tbody></table>";
    }
    el.innerHTML=html;
    el.className="mydeadlines";
  }

  function applyFilter(){
    var nodes=document.querySelectorAll("[data-fag]");
    for(var i=0;i<nodes.length;i++){
      var el=nodes[i];
      var f=el.getAttribute("data-fag");
      if(!activeFag || f===""){ el.classList.remove("dimmed"); el.classList.remove("fag-focus"); continue; }
      if(f===activeFag){ el.classList.remove("dimmed"); el.classList.add("fag-focus"); }
      else { el.classList.add("dimmed"); el.classList.remove("fag-focus"); }
    }
  }

  function hidePopover(){ document.getElementById("popoverEl").hidden=true; }
  function showPopover(x,y,name,sub,desc){
    var pop=document.getElementById("popoverEl");
    document.getElementById("popoverBody").innerHTML="<b>"+esc(name)+"</b><span class=\"pv-line\">"+esc(sub)+"</span>"+(desc?"<span class=\"pv-desc\">"+esc(desc)+"</span>":"");
    pop.hidden=false;
    var pw=pop.offsetWidth||240, ph=pop.offsetHeight||70;
    var left=Math.min(x+10, window.innerWidth-pw-10);
    var top=Math.min(y+10, window.innerHeight-ph-10);
    pop.style.left=Math.max(10,left)+"px";
    pop.style.top=Math.max(10,top)+"px";
  }

  document.getElementById("legendEl").addEventListener("click", function(e){
    var chip=e.target.closest("[data-fagfilter]");
    if(!chip) return;
    var id=chip.getAttribute("data-fagfilter");
    activeFag=(id==="")?null:(activeFag===id?null:id);
    renderLegend();
    applyFilter();
    renderMyDeadlines();
  });

  document.getElementById("timelineInner").addEventListener("click", function(e){
    var hit=e.target.closest(".hit");
    if(!hit) return;
    showPopover(e.clientX,e.clientY, hit.getAttribute("data-name")||"", hit.getAttribute("data-sub")||"", hit.getAttribute("data-desc")||"");
    e.stopPropagation();
  });
  document.getElementById("popoverClose").addEventListener("click", hidePopover);
  document.addEventListener("click", function(e){
    if(!e.target.closest(".hit") && !e.target.closest(".popover")) hidePopover();
  });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") hidePopover(); });

  renderLegend();
  renderTimeline();
  renderMyDeadlines();
})();</script>
</body>
</html>
